<!doctype html>
<html lang="en">
  <body style="margin: 0; padding: 24px; font-family: Arial, sans-serif; color: #1f2933">
    <h2 style="margin: 0 0 16px">Your Sitenote sign-in code</h2>
    <p style="margin: 0 0 16px">Enter this code to sign in to Sitenote:</p>
    <p style="margin: 0 0 16px; font-size: 32px; font-weight: 700; letter-spacing: 6px">
      {{ .Token }}
    </p>
    <p style="margin: 0; color: #52606d">
      The code expires in 10 minutes. If you did not request it, you can ignore this email.
    </p>
  </body>
</html>
