<!doctype html>
<html lang="en">
  <body style="margin: 0; padding: 24px; font-family: Arial, sans-serif; color: #1f2933">
    <h2 style="margin: 0 0 16px">Sign in to Sitenote</h2>
    <p style="margin: 0 0 16px">
      <a href="{{ .ConfirmationURL }}" style="color: #1f2933; font-weight: 700"
        >Sign in to Sitenote</a
      >
    </p>
    <p style="margin: 0 0 8px; color: #52606d">
      In the browser extension, enter this code instead:
    </p>
    <p style="margin: 0 0 16px; font-size: 32px; font-weight: 700; letter-spacing: 6px">
      {{ .Token }}
    </p>
    <p style="margin: 0; color: #52606d">
      The link and the code expire in 10 minutes. If you did not request them, you can ignore this
      email.
    </p>
  </body>
</html>
