<!doctype html>
<html lang="en">
  <body style="margin: 0; padding: 24px; font-family: Arial, sans-serif; color: #1f2933">
    <h2 style="margin: 0 0 16px">Your Sitenote sign-in link</h2>
    <p style="margin: 0 0 16px">Use this link to sign in to Sitenote:</p>
    <p style="margin: 0 0 16px; font-size: 18px; font-weight: 700">
      <a href="{{ .ConfirmationURL }}" style="color: #1f6feb">Sign in to Sitenote</a>
    </p>
    <p style="margin: 0 0 16px; color: #52606d">
      Or use this code: <strong style="letter-spacing: 6px; color: #1f2933">{{ .Token }}</strong>
    </p>
    <p style="margin: 0; color: #52606d">
      The link and the code expire in 10 minutes. If you did not request it, you can ignore this
      email.
    </p>
  </body>
</html>
