name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WXT_WEB_URL: https://app.sitenote.test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm --silent --filter @sitenote/core exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter @sitenote/core exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:manifest

  db:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta
      - run: pnpm db:env
      - run: pnpm test:rls
      - run: pnpm db:lint
      - name: Check generated database types are current
        run: |
          pnpm db:types
          if ! git diff --exit-code -- packages/db/src/database-types/index.ts; then
            echo "::error file=packages/db/src/database-types/index.ts::Generated database types are stale. Run pnpm db:start, pnpm db:reset and pnpm db:types, then commit the result."
            exit 1
          fi

  functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"
      - run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts supabase/functions/*/handler.ts supabase/functions/*/handler.test.ts
      - run: deno lint supabase/functions/clickup-create-task supabase/functions/clickup-save-settings supabase/functions/clickup-hierarchy supabase/functions/notify-email supabase/functions/_shared/runtime supabase/functions/_shared/supabase supabase/functions/_shared/testing
      - run: deno test --config supabase/functions/deno.json supabase/functions/clickup-create-task supabase/functions/clickup-save-settings supabase/functions/clickup-hierarchy supabase/functions/notify-email

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLICKUP_MOCK_HOST: 0.0.0.0
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm --silent --filter @sitenote/e2e exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter @sitenote/e2e exec playwright install --with-deps chromium
      - run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta
      - run: pnpm db:env
      - name: Write Edge Function settings for the mock ClickUp server
        run: |
          {
            echo "SITE_URL=http://localhost:3000"
            echo "WEBHOOK_SECRET=ci-webhook-secret"
            echo "CLICKUP_API_BASE=http://host.docker.internal:4411"
          } > supabase/functions/.env
      - name: Serve Edge Functions
        run: |
          pnpm exec supabase functions serve --env-file supabase/functions/.env > functions.log 2>&1 &
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS -H "Origin: http://localhost:3000" http://127.0.0.1:54321/functions/v1/clickup-hierarchy || true)
            if [ "$code" = "204" ]; then exit 0; fi
            sleep 2
          done
          cat functions.log
          exit 1
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore
